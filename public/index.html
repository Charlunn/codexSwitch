<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cx - Codex 账户管理器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 32px; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 32px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 18px;
        }
        .logo-text {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 24px; margin-bottom: 20px;
        }
        .card h2 { margin-bottom: 16px; font-size: 16px; color: #666; }
        .card h1 { font-size: 20px; margin-bottom: 8px; }
        .card p { color: #888; font-size: 14px; }
        .account-list { display: flex; flex-direction: column; gap: 12px; }
        .account-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; background: #fafafa;
            border-radius: 12px; border: 1px solid #eee;
            transition: all 0.2s;
        }
        .account-item:hover { border-color: #6366f1; transform: translateX(4px); }
        .account-item.active { border-color: #6366f1; background: #f0f0ff; }
        .account-info { display: flex; align-items: center; gap: 16px; }
        .account-avatar {
            width: 44px; height: 44px; border-radius: 10px;
            background: linear-gradient(135deg, #e0e0ff, #f0f0f0);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: #6366f1; font-size: 16px;
        }
        .account-details h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .account-details p { font-size: 13px; color: #999; }
        .badge {
            padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
        }
        .badge-plus { background: #e0e0ff; color: #6366f1; }
        .badge-team { background: #fef3c7; color: #d97706; }
        .badge-active { background: #d1fae5; color: #059669; }
        .btn {
            padding: 8px 16px; border-radius: 8px;
            font-weight: 500; font-size: 14px;
            cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fecaca; }
        .btn-secondary { background: #f5f5f5; color: #666; }
        .btn-secondary:hover { background: #eee; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: white; border-radius: 16px;
            padding: 32px; width: 100%; max-width: 400px;
            transform: scale(0.95); transition: all 0.2s;
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h2 { margin-bottom: 24px; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #666; }
        .form-input {
            width: 100%; padding: 12px 14px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 14px 20px; background: white;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s; z-index: 2000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }
        .empty-state { text-align: center; padding: 48px 24px; color: #999; }
        .proxy-status {
            display: flex; align-items: center; gap: 16px;
            padding: 16px; background: #f0fdf4; border-radius: 12px;
            margin-bottom: 20px;
        }
        .proxy-status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #10b981;
        }
        .proxy-status .dot.error { background: #ef4444; }
        .proxy-status .text { font-size: 14px; color: #666; }
        .proxy-status .port { font-weight: 600; color: #333; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-item { background: white; padding: 16px; border-radius: 12px; text-align: center; }
        .stat-item .value { font-size: 24px; font-weight: 700; color: #6366f1; }
        .stat-item .label { font-size: 12px; color: #999; margin-top: 4px; }
        .quota-bar { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 8px; }
        .quota-bar .fill { height: 100%; background: #6366f1; border-radius: 3px; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">cx</div>
                <span class="logo-text">cx</span>
            </div>
            <button class="btn btn-primary" onclick="loginWithOAuth()">+ 添加账户</button>
        </header>

        <div class="proxy-status">
            <div class="dot"></div>
            <div class="text">
                代理运行中 | 监听 <span class="port">127.0.0.1:1338</span>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-item">
                <div class="value" id="totalRequests">0</div>
                <div class="label">总请求</div>
            </div>
            <div class="stat-item">
                <div class="value" id="activeAccounts">2</div>
                <div class="label">活跃账户</div>
            </div>
            <div class="stat-item">
                <div class="value" id="successRate">100%</div>
                <div class="label">成功率</div>
            </div>
            <div class="stat-item">
                <div class="value" id="balanceStrategy">配额</div>
                <div class="label">负载策略</div>
            </div>
        </div>

        <div class="card">
            <h2>已登录账户</h2>
            <div class="account-list" id="accountList">
                <div class="empty-state">加载中...</div>
            </div>
        </div>

        <div class="card">
            <h2>使用指南</h2>
            <div style="font-size: 14px; color: #666; line-height: 1.8;">
                <p style="margin-bottom: 12px;"><strong>1. 设置系统代理</strong></p>
                <div style="background: #f5f5f5; padding: 12px; border-radius: 8px; font-family: monospace; margin-bottom: 16px;">
                    Windows: 设置 → 网络 → 代理 → 127.0.0.1:1338<br>
                    或环境变量: HTTP_PROXY=http://127.0.0.1:1338
                </div>
                <p style="margin-bottom: 12px;"><strong>2. Codex CLI/IDE</strong></p>
                <div style="background: #f5f5f5; padding: 12px; border-radius: 8px; font-family: monospace;">
                    无需任何配置！所有请求自动经过 cx 代理负载均衡
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>添加 OpenAI 账户</h2>
            <form onsubmit="handleAdd(event)">
                <div class="form-group">
                    <label class="form-label">OpenAI 邮箱</label>
                    <input type="email" class="form-input" id="email" placeholder="email@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">API Key (可选)</label>
                    <input type="text" class="form-input" id="apiKey" placeholder="sk-...">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';

        async function loadAccounts() {
            try {
                const res = await fetch(`${API}/accounts`);
                const accounts = await res.json();
                renderAccounts(accounts);
            } catch (err) {
                showToast('加载账户失败', 'error');
            }
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API}/proxy/stats`);
                const stats = await res.json();
                document.getElementById('totalRequests').textContent = stats.totalRequests || 0;
                document.getElementById('activeAccounts').textContent = (stats.accounts || []).filter(a => a.status === 'active').length;
                if (stats.totalRequests > 0) {
                    const rate = Math.round((stats.successfulRequests / stats.totalRequests) * 100);
                    document.getElementById('successRate').textContent = rate + '%';
                }
            } catch (err) {}
        }

        function renderAccounts(accounts) {
            const list = document.getElementById('accountList');
            if (!accounts || accounts.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无账户，请添加 OpenAI 账户</div>';
                return;
            }
            list.innerHTML = accounts.map((a, i) => `
                <div class="account-item ${a.isActive ? 'active' : ''}" style="animation-delay: ${i * 0.05}s">
                    <div class="account-info">
                        <div class="account-avatar">${a.email[0].toUpperCase()}</div>
                        <div class="account-details">
                            <h3>${a.email}</h3>
                            <p>配额: ${a.quota.used}/${a.quota.limit}</p>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge badge-${a.plan}">${a.plan === 'plus' ? 'Plus' : 'Team'}</span>
                        ${a.isActive ? '<span class="badge badge-active">使用中</span>' : ''}
                        ${!a.isActive ? `<button class="btn btn-secondary" onclick="switchAccount('${a.id}')">切换</button>` : ''}
                        <button class="btn btn-danger" onclick="deleteAccount('${a.id}')" style="padding: 6px 10px; font-size: 12px;">删除</button>
                    </div>
                </div>
                <div class="quota-bar" style="margin-top: -8px; margin-bottom: 12px;">
                    <div class="fill" style="width: ${(a.quota.used / a.quota.limit) * 100}%"></div>
                </div>
            `).join('');
        }

        async function switchAccount(id) {
            try {
                const res = await fetch(`${API}/accounts/${id}/switch`, { method: 'PUT' });
                if (res.ok) {
                    showToast('切换成功', 'success');
                    loadAccounts();
                }
            } catch (err) {
                showToast('切换失败', 'error');
            }
        }

        async function deleteAccount(id) {
            if (!confirm('确定删除此账户？')) return;
            try {
                const res = await fetch(`${API}/accounts/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('已删除', 'success');
                    loadAccounts();
                }
            } catch (err) {
                showToast('删除失败', 'error');
            }
        }

        function handleAdd(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const apiKey = document.getElementById('apiKey').value;

            // 模拟添加
            showToast('账户添加成功', 'success');
            closeModal();
            loadAccounts();
        }

        function loginWithOAuth() {
            window.location.href = '/api/auth/login';
        }

        function openAddModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('email').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('apiKey').value = '';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        loadAccounts();
        loadStats();
        setInterval(loadStats, 3000);

        // 处理 OAuth 回调参数
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showToast('登录失败: ' + decodeURIComponent(urlParams.get('error')), 'error');
            history.replaceState({}, '', window.location.pathname);
        }
        if (urlParams.get('success')) {
            const apiKey = urlParams.get('apiKey');
            showToast('登录成功！您的 API Key: ' + apiKey, 'success');
            history.replaceState({}, '', window.location.pathname);
        }
    </script>
</body>
</html>
